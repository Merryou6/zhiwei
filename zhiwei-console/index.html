<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知微 · 初中数学学习空间</title>
<meta name="theme-color" content="#122139">
<meta name="description" content="知微 —— 初中数学 AI 学习平台，基于知识图谱的诊断、辅导与报告。">
<!-- 标识：与顶栏 brand-mark 同一套几何，内联避免额外请求；小尺寸做光学补偿（更粗、去细节） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%23162945'/%3E%3Cpath d='M9.7 9.5 18.1 14 9.7 18.5' fill='none' stroke='%2342a5f5' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='9.7' cy='9.5' r='2.3' fill='%23e8edf3'/%3E%3Ccircle cx='18.1' cy='14' r='2.9' fill='%2342a5f5'/%3E%3Ccircle cx='9.7' cy='18.5' r='1.9' fill='%238b95a8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/inter.css">
<link rel="stylesheet" href="design.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">

      <a class="brand" href="#/space" title="学习空间">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect x=".5" y=".5" width="27" height="27" rx="7" fill="#1e293b" stroke="#334155"/>
          <path d="M9.7 9.5 L18.1 14 L9.7 18.5" fill="none" stroke="#42a5f5" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
          <circle cx="9.7" cy="9.5" r="2" fill="#e8edf3"/>
          <circle cx="18.1" cy="14" r="2.6" fill="#42a5f5"/>
          <circle cx="9.7" cy="18.5" r="1.6" fill="#8b95a8"/>
        </svg>
        <span class="brand-word">知微</span>
      </a>

      <span class="nav-sep" aria-hidden="true"></span>

      <nav class="tabs" aria-label="主导航">
        <a class="tab" href="#/assessment" data-route="#/assessment">测评</a>
        <a class="tab" href="#/chat"       data-route="#/chat">对话辅导</a>
        <a class="tab" href="#/graph"      data-route="#/graph">知识图谱</a>
        <a class="tab" href="#/report"     data-route="#/report">学习报告</a>
        <a class="tab" href="#/drive"      data-route="#/drive">云盘</a>
      </nav>

      <div class="topbar-right">
        <button class="space-chip" type="button" title="切换空间">
          <span class="space-chip-mark" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 5.4 8 2.4l6 3v5.2l-6 3-6-3z"/><path d="M2 5.4 8 8.4l6-3M8 8.4v5.2"/>
            </svg>
          </span>
          <span class="space-chip-label">空间·初中数学</span>
          <svg class="space-chip-caret" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m4 6.5 4 4 4-4"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <main class="page" id="view"></main>
</div>

<script src="data/knowledge-graph.js"></script>
<script src="app.js"></script>
</body>
</html>
