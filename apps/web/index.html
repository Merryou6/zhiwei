<!doctype html>
<!-- 主题（style-10 迁移 P3，D2 / 拍板①）：默认**跟随系统、优先白图** ——
     显式偏好（zhiwei_theme）最优先，无偏好时仅当系统 prefers-color-scheme: dark
     才用蓝图（html.dusk），其余一律白图。由 head 区的内联同步脚本裁决，
     不再在 HTML 上硬编码 dusk（见 src/index.css 的角色层、src/stores/theme.ts）。
     脚本必须在 body 渲染前跑完，首帧才不会闪；异常兜底一律白图，与默认一致。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover（2026-09-24 移动端适配轮 D14）：让页面铺满刘海屏安全区，
         再由 index.css 的 pt-safe/pb-safe/bottom-safe-* 工具类按 env() 避让。
         桌面非刘海设备 env(safe-area-inset-*) 恒为 0 → 渲染数值不变。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>知微 · 学习伴侣</title>
    <!-- 搜索引擎/分享卡片摘要（前端优化批二 · 2026-09-22） -->
    <meta
      name="description"
      content="知微：先弄清你卡在哪个知识点，再陪你把它补上的初中数学学习伴侣。自适应测评 + 知识图谱归因 + 学长式对话辅导。"
    />
    <!-- 浏览器 UI 主题色（移动端状态栏/地址栏）。初始值 = 默认主题（白图）的页面底色；
         蓝图主题下由下面的内联脚本改写为 #0B1B2B，运行期切换由 theme store 同步改写。 -->
    <meta name="theme-color" content="#F4F7FA" />

    <!-- 站点图标：SVG 为主，另给 apple-touch-icon 便于「添加到主屏」 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- 分享卡片（Open Graph / Twitter）。
         注意：部署到公网后请把 og:url 与 og:image 换成本域绝对地址（当前无正式域名，先用相对路径）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="知微 · 学习伴侣" />
    <meta property="og:title" content="知微 · 学习伴侣" />
    <meta
      property="og:description"
      content="先弄清你卡在哪个知识点，再陪你把它补上。自适应测评、知识图谱归因、学长式对话辅导。"
    />
    <meta property="og:image" content="./og-cover.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="知微 · 学习伴侣" />
    <meta name="twitter:description" content="先弄清你卡在哪个知识点，再陪你把它补上。" />
    <meta name="twitter:image" content="./og-cover.png" />

    <!-- 首帧主题裁决（D2 重写）：同步内联脚本，读 localStorage 的 zhiwei_theme 决定是否挂 dusk。
         规则（必须与 src/stores/theme.ts 的 resolveInitialTheme 逐字一致）：
           'dark'  → 挂 dusk；'light' → 不挂；
           其余（读不到 / 空串 / 脏值）→ 看 (prefers-color-scheme: dark)，命中才挂。
         位置：theme-color meta 之后（要能改写它）、样式块之前（先于样式执行，首帧不闪）。
         注意：注释里不要写尖括号标签名 —— Vite 会按 head 标签注入 @vite/client，
         一旦注释里出现会误命中（实测把注入的脚本塞进注释内，HMR 直接失效）。
         键名与 src/router.ts 的 STORAGE_KEYS.theme 一致；异常 → 白图（与默认观感一致）。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zhiwei_theme');
          var d;
          if (t === 'dark') d = true;
          else if (t === 'light') d = false;
          else {
            d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          if (d) document.documentElement.classList.add('dusk');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', d ? '#0B1B2B' : '#F4F7FA');
        } catch (e) {
          /* 异常兜底 = 白图（默认观感），不挂 dusk */
        }
      })();
    </script>

    <!-- 首屏底色：跟随主题双分支，避免 JS 加载前的白闪（白图 #F4F7FA / 蓝图 #0B1B2B） -->
    <style>
      html {
        background-color: #f4f7fa;
      }
      html.dusk {
        background-color: #0b1b2b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
